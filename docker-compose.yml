services:
  postgres:
    image: postgres:17-alpine
    container_name: crud-express-ts-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docker
      POSTGRES_PASSWORD: docker
      POSTGRES_DB: crud_express_ts
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U docker -d crud_express_ts']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
